databases:
  - name: odoo20-poc-db
    databaseName: resbook_db
    user: odoo
    plan: free

services:
  - type: web
    name: odoo20-resbook-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8069
      - key: ODOO_RC
        value: /etc/odoo/odoo.conf
      # CRITICAL CORRECTION: Standard Odoo-recognized environment mapping keys
      - key: ODOO_HOST
        fromDatabase:
          name: odoo20-poc-db
          property: host
      - key: ODOO_PORT
        value: 5432
      - key: USER
        fromDatabase:
          name: odoo20-poc-db
          property: user
      - key: PASSWORD
        fromDatabase:
          name: odoo20-poc-db
          property: password