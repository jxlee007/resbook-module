# 🗄️ Databases section separated from services block
databases:
  - name: odoo20-poc-db
    databaseName: resbook_db
    user: odoo
    plan: free

# 🚀 Services section strictly for application runtimes
services:
  - type: web
    name: odoo20-resbook-app
    runtime: docker
    plan: free
    port: 8069
    dockerfilePath: ./Dockerfile
    envVars:
      - key: HOST
        fromDatabase:
          name: odoo20-poc-db
          property: host
      - key: USER
        fromDatabase:
          name: odoo20-poc-db
          property: user
      - key: PASSWORD
        fromDatabase:
          name: odoo20-poc-db
          property: password
    dockerCommand: >
      odoo
      -c /etc/odoo/odoo.conf
      --db_host=$HOST
      --db_user=$USER
      --db_password=$PASSWORD
      -i base,resource_booking
      --without-demo=False