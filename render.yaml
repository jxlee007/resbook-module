databases:
  - name: odoo20-poc-db
    databaseName: resbook_db
    user: odoo
    plan: free

services:
  - type: web
    name: odoo20-resbook-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8069
      # 🗄️ Database Mapping Context
      - key: ODOO_HOST
        fromDatabase:
          name: odoo20-poc-db
          property: host
      - key: ODOO_PORT
        value: 5432
      - key: USER
        fromDatabase:
          name: odoo20-poc-db
          property: user
      - key: PASSWORD
        fromDatabase:
          name: odoo20-poc-db
          property: password
      # 🔄 Odoo Initialization Parameters Matrix
      - key: ODOO_DATABASE
        value: resbook_db
      - key: ODOO_INIT
        value: base,resource_booking
      - key: ODOO_WITHOUT_DEMO
        value: "False"