[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

# Credentials and Database defaults
admin_passwd = admin
db_name = resbook_db

# CRITICAL ODOO 20 RENDER COMPATIBILITY: Force initialization arguments here
init = base,resource_booking
without_demo = False

# Network routing configurations
http_interface = 0.0.0.0
http_port = 8069
proxy_mode = True

log_handler = :INFO
log_level = info