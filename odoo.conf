[options]
# Linux paths mapped inside the Docker container
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

# Credentials and Database defaults
admin_passwd = admin
db_name = resbook_db

# CRITICAL FOR RENDER: Bind to all interfaces so Render's proxy can access it
http_interface = 0.0.0.0
http_port = 8069
proxy_mode = True

# Logging options matching your choices
log_handler = :INFO
log_level = info